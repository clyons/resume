      ;(() => {
        if (window.__ciaranThemeToggleInitialized) {
          window.__ciaranBindThemeToggles?.()
          return
        }

        window.__ciaranThemeToggleInitialized = true

        const storageKey = 'ciaranlyons-theme'
        const root = document.documentElement
        const media = window.matchMedia('(prefers-color-scheme: dark)')

        const systemTheme = () => (media.matches ? 'dark' : 'light')
        const savedTheme = () => {
          try {
            const value = window.localStorage.getItem(storageKey)
            return value === 'light' || value === 'dark' ? value : null
          } catch {
            return null
          }
        }
        const setTheme = (theme) => {
          root.dataset.theme = theme
          root.classList.toggle('dark', theme === 'dark')
          updateToggles()
        }
        const updateToggles = () => {
          const activeTheme = root.dataset.theme === 'dark' ? 'dark' : 'light'
          const nextTheme = activeTheme === 'dark' ? 'light' : 'dark'
          const isSystemTheme = !savedTheme()
          const action = nextTheme === systemTheme() && !isSystemTheme ? `Return to system ${nextTheme} mode` : `Switch to ${nextTheme} mode`

          document.querySelectorAll('[data-theme-toggle]').forEach((button) => {
            button.setAttribute('aria-label', action)
            button.setAttribute('title', action)
            button.setAttribute('aria-pressed', String(activeTheme === 'dark'))
          })
        }
        const toggleTheme = () => {
          const activeTheme = root.dataset.theme === 'dark' ? 'dark' : 'light'
          const nextTheme = activeTheme === 'dark' ? 'light' : 'dark'

          try {
            if (nextTheme === systemTheme()) {
              window.localStorage.removeItem(storageKey)
            } else {
              window.localStorage.setItem(storageKey, nextTheme)
            }
          } catch {
            // Keep the current-session change when storage is unavailable.
          }

          setTheme(nextTheme)
        }
        const bindThemeToggles = () => {
          document.querySelectorAll('[data-theme-toggle]').forEach((button) => {
            if (button.dataset.themeToggleBound) return
            button.dataset.themeToggleBound = 'true'
            button.addEventListener('click', toggleTheme)
          })

          setTheme(savedTheme() ?? systemTheme())
        }

        media.addEventListener('change', () => {
          if (!savedTheme()) setTheme(systemTheme())
        })

        window.__ciaranBindThemeToggles = bindThemeToggles
        bindThemeToggles()
        document.addEventListener('astro:after-swap', bindThemeToggles)
      })()
    </script></body></html>
